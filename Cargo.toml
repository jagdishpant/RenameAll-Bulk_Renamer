[package]
name = "rename_all"
version = "1.0.0"
edition = "2021"
description = "Bulk Renamer"
default-run = "RenameAll"

[[bin]]
name = "RenameAll"
path = "src/main.rs"

[lib]
name = "rename_all"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = "0.29"
regex = "1.11"
rfd = "0.15"
walkdir = "2.5"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"
